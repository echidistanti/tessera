name: Release

# Pushing a tag such as v0.3.0 builds the executable and the installer and publishes a release.
# "Run workflow" builds them without publishing, to check that the pipeline works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from Cargo.toml
        id: version
        shell: bash
        run: echo "number=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.number }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${{ steps.version.outputs.number }}"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=${{ steps.version.outputs.number }}"
          installer\tessera.iss

      - name: Collect the files
        shell: bash
        run: |
          mkdir out
          cp target/release/tessera.exe out/tessera.exe
          cp "dist/Tessera-Setup-${{ steps.version.outputs.number }}.exe" out/
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the files with the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ steps.version.outputs.number }}
          path: out/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # The release was created first (for instance on the GitHub web page): add the files.
            gh release upload "${GITHUB_REF_NAME}" out/* --clobber
          else
            # The release notes are the section of CHANGELOG.md for this version.
            awk -v v="${{ steps.version.outputs.number }}" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              /^## \[/ { if (found) exit }
              found { print }
            ' CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              echo "CHANGELOG.md has no section for version ${{ steps.version.outputs.number }}"
              exit 1
            fi
            gh release create "${GITHUB_REF_NAME}" out/* \
              --title "Tessera ${{ steps.version.outputs.number }}" \
              --notes-file notes.md
          fi

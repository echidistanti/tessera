name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
